# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "fairbioheaders_validate"
description: Validate standalone FAIR-bioHeaders metadata (FHR, FHP or FHGFF3, as JSON or
  YAML) against the schema its schema URL selects, without a sequence file
keywords:
  - metadata
  - validation
  - json
  - yaml
  - provenance
  - fair
  - schema
tools:
  - "fair-bioheaders":
      description: "FAIR-bioHeaders Tools: validate, convert, combine and strip FAIR-bioHeaders
        (FHR, FHP, FHGFF3) provenance metadata embedded in FASTA, GFA and GFF3 headers"
      homepage: "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools"
      documentation: "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools#readme"
      tool_dev_url: "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools"
      doi: "10.1093/bib/bbae122"
      licence: ["MPL-2.0"]
      identifier: ""

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
    - metadata:
        type: file
        description: Standalone FHR, FHP or FHGFF3 metadata. The format comes from the
          extension (`.json`, `.yaml` or `.yml`); `ext.args` can pass `--from`
        pattern: "*.{json,yaml,yml}"
        ontologies:
          - edam: http://edamontology.org/format_3464 # JSON
          - edam: http://edamontology.org/format_3750 # YAML
output:
  report:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
      - "*.validate.txt":
          type: file
          description: Text report naming the file and the result. The task fails when
            the metadata does not validate against its schema
          pattern: "*.validate.txt"
          ontologies:
            - edam: http://edamontology.org/format_2330 # Textual format
  versions_fairbioheaders:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fair-bioheaders:
          type: string
          description: The name of the tool
      - bioheaders --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fair-bioheaders:
          type: string
          description: The name of the tool
      - bioheaders --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@molikd"
  - "@adamjohnwright"
maintainers:
  - "@molikd"
  - "@adamjohnwright"
