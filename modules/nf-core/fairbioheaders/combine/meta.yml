# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "fairbioheaders_combine"
description: Attach FAIR-bioHeaders (FHR, FHP or FHGFF3) provenance metadata to a FASTA,
  protein FASTA, GFA or GFF3 file as a header, after validating it against its schema,
  and record the file's SHA-512/256 checksum in it
keywords:
  - fasta
  - gfa
  - gff3
  - protein
  - metadata
  - provenance
  - fair
  - genome assembly
tools:
  - "fair-bioheaders":
      description: "FAIR-bioHeaders Tools: validate, convert, combine and strip FAIR-bioHeaders
        (FHR, FHP, FHGFF3) provenance metadata embedded in FASTA, GFA and GFF3 headers"
      homepage: "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools"
      documentation: "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools#readme"
      tool_dev_url: "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools"
      doi: "10.1093/bib/bbae122"
      licence: ["MPL-2.0"]
      identifier: ""

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
    - metadata:
        type: file
        description: FHR, FHP or FHGFF3 metadata (JSON or YAML) for the sequence file.
          Its schema URL selects the header type and so the output name. Any checksum
          it contains is replaced by the combined file's checksum
        pattern: "*.{json,yaml,yml}"
        ontologies:
          - edam: http://edamontology.org/format_3464 # JSON
          - edam: http://edamontology.org/format_3750 # YAML
    - sequence:
        type: file
        description: FASTA (FHR or, for protein FASTA, FHP header), GFA (FHR header) or
          GFF3 (FHGFF3 header) file, plain or gzip/BGZF-compressed. `.faa` is read as
          FASTA. Sequence bytes are kept unchanged; an existing header is replaced
        pattern: "*.{fa,fasta,fna,fas,faa,gfa,gff,gff3}{,.gz,.bgz}"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
          - edam: http://edamontology.org/format_3975 # GFA 1
          - edam: http://edamontology.org/format_1975 # GFF3
output:
  sequence:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
      - ${prefix}.fh*:
          type: file
          description: The file with its header, named by header type (`.fhr.fa`,
            `.fhr.gfa`, `.fhp.faa` or `.fhgff3.gff3`), BGZF-compressed with `.gz`
            when the input was compressed
          pattern: "*.{fhr.fa,fhr.gfa,fhp.faa,fhgff3.gff3}{,.gz}"
          ontologies:
            - edam: http://edamontology.org/format_1929 # FASTA
            - edam: http://edamontology.org/format_3975 # GFA 1
            - edam: http://edamontology.org/format_1975 # GFF3
  versions_fairbioheaders:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fair-bioheaders:
          type: string
          description: The name of the tool
      - bioheaders --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fair-bioheaders:
          type: string
          description: The name of the tool
      - bioheaders --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@adamjohnwright"
maintainers:
  - "@adamjohnwright"
  - "@molikd"
