# Runs the supported baseline: Nextflow 26.04.6, Java 21, Python 3.13,
# FAIR-bioHeaders-Tools 0.9.0 and gff3-validator 0.1.0. Actions and downloads are pinned by digest.
# Jobs: test (tests/run.py and the Docker examples of main.nf), nf-test (the nf-core-style
# modules in modules/nf-core) and dockstore-workflow (workflows/fairbioheaders). The last
# two came from FAIR-bioHeaders-Tools' nextflow-modules.yml and nextflow-workflow.yml (#21).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NXF_VER: 26.04.6
  # sha256 of the nextflow-26.04.6-dist release asset (self-contained launcher).
  NXF_DIST_SHA256: 182a63c74074e2dc7956ffa3c8cd59de952ed2c44394e21faf5e1736b945444c
  # FAIR-bioHeaders-Tools tag v0.9.0; the commit is pinned because tags can move.
  CONVERTER_COMMIT: c6d74540416548597ad6305c1ad3731fc92ed6a2
  NXF_ANSI_LOG: 'false'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out FAIR-bioHeaders-Tools v0.9.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FAIR-bioHeaders/FAIR-bioHeaders-Tools
          ref: ${{ env.CONVERTER_COMMIT }}
          path: converter
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Nextflow
        run: |
          curl -fsSL -o nextflow "https://github.com/nextflow-io/nextflow/releases/download/v${NXF_VER}/nextflow-${NXF_VER}-dist"
          echo "${NXF_DIST_SHA256}  nextflow" | sha256sum --check
          chmod +x nextflow
          sudo mv nextflow /usr/local/bin/nextflow
          nextflow -version

      - name: Install the converter environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --no-deps -r environment/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" -m pip check
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Integration tests
        run: python tests/run.py --converter-source converter

      - name: Build container
        run: docker build -t fhr-nextflow:0.1.0 environment

      - name: Docker example
        env:
          NXF_OFFLINE: 'true'
        run: |
          nextflow run main.nf -profile docker \
            --sequence examples/assembly.gfa --sequence_format gfa \
            --converter_source converter --outdir "$RUNNER_TEMP/results"
          test -s "$RUNNER_TEMP/results/example/sequence/example.gfa"
          test -s "$RUNNER_TEMP/results/converter-tests/converter-tests.xml"

      - name: Docker FASTA example
        env:
          NXF_OFFLINE: 'true'
        run: |
          nextflow run main.nf -profile docker \
            --sequence examples/genome.fasta --sequence_format fasta \
            --outdir "$RUNNER_TEMP/fasta-results"
          test -s "$RUNNER_TEMP/fasta-results/example/sequence/example.fasta"

      - name: Docker GFF3 example
        env:
          NXF_OFFLINE: 'true'
        run: |
          nextflow run main.nf -profile docker \
            --gff3 'tests/fixtures/gff3/*.gff3' --gff3_genome tests/fixtures/gff3/genome.fa \
            --gff3_fail_on_errors false --outdir "$RUNNER_TEMP/gff3-results"
          test -s "$RUNNER_TEMP/gff3-results/bio-008-internal-stop/gff3/bio-008-internal-stop.gff3-validate.json"
          test -s "$RUNNER_TEMP/gff3-results/str-001-duplicate-id/gff3/str-001-duplicate-id.gff3-validate.html"

      - name: Docker protein example
        env:
          NXF_OFFLINE: 'true'
        run: |
          nextflow run main.nf -profile docker \
            --metadata examples/protein-metadata.json \
            --sequence examples/protein.faa --sequence_format faa \
            --outdir "$RUNNER_TEMP/protein-results"
          test -s "$RUNNER_TEMP/protein-results/protein-metadata/sequence/protein-metadata.faa"
          grep -q '^;~schema: .*/fhp/v0.4.0' "$RUNNER_TEMP/protein-results/protein-metadata/sequence/protein-metadata.faa"

      - run: git diff --check HEAD

  nf-test:
    # The modules pin bioconda::fair-bioheaders=X.Y.Z. The four pinned upstream modules
    # (modules.json: combine, validate, convert and, since #29's final slice, verify) run
    # the Seqera Wave image built from that Bioconda package; the repository-owned modules
    # (strip and verify_links) pin the BioContainers image
    # quay.io/biocontainers/fair-bioheaders:X.Y.Z--<build> and its
    # Galaxy depot pair. Check that all of them agree with the Bioconda pin, verify that
    # the pinned files still match the recorded nf-core/modules revisions, then run
    # nf-test, which pulls the images.
    #
    # Snapshot baselines (issue #7, maintainer decision 6B of 2026-11-14): the committed
    # upstream main.nf.test.snap files record meta.nextflow 26.10.4, while this suite's
    # supported baseline is 26.04.6. Both are exercised here so snapshot-baseline drift is
    # a CI result rather than a property of whichever host runs nf-test.
    # Failure semantics: fail-fast is off, so one leg never hides the other and a green
    # 26.04.6 leg next to a red 26.10.4 leg reads as drift in the newer engine's output,
    # not as a broken module. Each leg is a separately named check (nf-test (Nextflow
    # 26.04.6), nf-test (Nextflow 26.10.4)), and the "Record the engine..." step prints the
    # version actually resolved plus the meta.nextflow recorded in the committed snapshots,
    # so the log names the diverging pair without re-running anything. A red leg means the
    # snapshot content produced by that engine differs from the committed baseline; it is
    # never fixed by editing a pinned module — re-record or update upstream per
    # docs/module-migration.md.
    name: nf-test (Nextflow ${{ matrix.nxf_version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 26.04.6 = this suite's supported baseline (env.NXF_VER, nextflow.config,
        # README); 26.10.4 = the Nextflow the pinned upstream snapshots were recorded under.
        nxf_version: ['26.04.6', '26.10.4']
    env:
      # Overrides the workflow-level NXF_VER for this job only, so the launcher the
      # nf-core action installs and the one nf-test then runs are the matrix version.
      NXF_VER: ${{ matrix.nxf_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that each module's container matches its Bioconda pin
        run: |
          version="$(sed -n 's/.*bioconda::fair-bioheaders=\([0-9][0-9.]*\)".*/\1/p' modules/nf-core/fairbioheaders/combine/environment.yml)"
          test -n "$version"
          for module in combine validate convert verify; do
            grep -q "bioconda::fair-bioheaders=$version" "modules/nf-core/fairbioheaders/$module/environment.yml"
            grep -q "community.wave.seqera.io/library/fair-bioheaders:$version--" "modules/nf-core/fairbioheaders/$module/main.nf"
          done
          for module in modules/strip modules/verify_links; do
            grep -q "^ *- bioconda::fair-bioheaders=$version$" "$module/environment.yml"
            grep -q "quay.io/biocontainers/fair-bioheaders:$version--" "$module/main.nf"
            grep -q "depot.galaxyproject.org/singularity/fair-bioheaders:$version--" "$module/main.nf"
          done
          # The converter tests' conda environment and the hash-locked image follow the same release.
          grep -q "^ *- bioconda::fair-bioheaders=$version$" modules/converter_tests/environment.yml
          grep -q "fair_bioheaders-$version-py3-none-any.whl" environment/requirements.in
      - name: Check that the pinned upstream modules match their recorded revisions
        run: |
          python3 -m unittest discover -s tests -p test_upstream_modules.py -v
          python3 scripts/check_upstream_modules.py
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with:
          version: ${{ matrix.nxf_version }}
      - uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2.1.0
        with:
          version: 0.9.5
      - name: Record the engine and the snapshot baselines under test
        run: |
          echo "matrix leg: ${{ matrix.nxf_version }}"
          echo 'engine actually resolved:'
          nextflow -version 2>&1 | sed -n 's/^ *version /  nextflow /p'
          echo 'nf-test under test:'
          nf-test version 2>&1 | sed -n '1p'
          echo 'meta.nextflow recorded in the committed snapshots:'
          grep -h '"nextflow"' modules/nf-core/fairbioheaders/*/tests/main.nf.test.snap | sort | uniq -c
      - name: Run nf-test
        run: nf-test test --profile docker --ci --verbose
      - name: Point at the failing leg on mismatch
        if: failure()
        run: |
          echo "::error::nf-test failed on the Nextflow ${{ matrix.nxf_version }} baseline. The other matrix leg keeps running (fail-fast: false): compare the two check names to tell a baseline-specific snapshot drift from a real module break. --ci never rewrites a snapshot; see docs/module-migration.md for the recorded update procedure."

  dockstore-workflow:
    # Runs workflows/fairbioheaders (described for Dockstore by .dockstore.yml) with
    # -profile test,docker. The workflow composes the pinned upstream
    # FAIRBIOHEADERS_COMBINE and FAIRBIOHEADERS_VERIFY modules (modules/nf-core/
    # fairbioheaders/*; issue #29 option (a) input-faithful naming, verify pinned at its
    # merged upstream revision); both run the Seqera Wave image family. Check their
    # Bioconda pin and container family first.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the workflow uses the modules' containers and Bioconda pin
        run: |
          workflow=workflows/fairbioheaders
          # No container override: each process runs its module's container.
          if grep -nE '^\s*container\s*=' "$workflow/nextflow.config"; then exit 1; fi
          version="$(sed -n 's/^ *- bioconda::fair-bioheaders=\([0-9.]*\)$/\1/p' "$workflow/environment.yml")"
          test -n "$version"
          # COMBINE and VERIFY are both pinned upstream modules (Seqera Wave image;
          # #29 option (a), verify adopted at its merged revision).
          for module in combine verify; do
            grep -qE "^ *- \"?bioconda::fair-bioheaders=$version\"?$" "modules/nf-core/fairbioheaders/$module/environment.yml"
            grep -q "community.wave.seqera.io/library/fair-bioheaders:$version--" "modules/nf-core/fairbioheaders/$module/main.nf"
          done
          # .dockstore.yml points at files that exist.
          for path in $(grep -oE '^ *(primaryDescriptorPath: |readMePath: |- )/[A-Za-z0-9_./-]+$' .dockstore.yml | grep -oE '/[A-Za-z0-9_./-]+$'); do
            test -f ".$path"
          done
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with:
          version: ${{ env.NXF_VER }}
      - name: Run the test profile
        run: |
          nextflow run workflows/fairbioheaders/main.nf -profile test,docker --outdir results
          # Issue #29 option (a): upstream combine names each output after the input's
          # extension, so the headed files are fasta.fa / gfa.gfa / gff3.gff3 /
          # jsonld.fa / proteins.faa (the protein row's id is `proteins` so its output
          # proteins.faa cannot collide with the staged protein.faa input).
          for id in fasta gfa gff3 jsonld proteins; do
            grep -q '^Checksum verified\.$' "results/verify/$id.verify.txt"
          done
          test -s results/combine/proteins.faa
          ls -l results/combine results/verify
