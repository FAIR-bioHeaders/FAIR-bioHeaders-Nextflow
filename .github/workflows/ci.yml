# Runs the supported baseline: Nextflow 26.04.6, Java 21, Python 3.13,
# FAIR-bioHeaders-Tools 0.8.2 and gff3-validator 0.1.0. Actions and downloads are pinned by digest.
# Jobs: test (tests/run.py and the Docker examples of main.nf), nf-test (the nf-core-style
# modules in modules/nf-core) and dockstore-workflow (workflows/fairbioheaders). The last
# two came from FAIR-bioHeaders-Tools' nextflow-modules.yml and nextflow-workflow.yml (#21).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NXF_VER: 26.04.6
  # sha256 of the nextflow-26.04.6-dist release asset (self-contained launcher).
  NXF_DIST_SHA256: 182a63c74074e2dc7956ffa3c8cd59de952ed2c44394e21faf5e1736b945444c
  # FAIR-bioHeaders-Tools tag v0.8.2; the commit is pinned because tags can move.
  CONVERTER_COMMIT: 6e4dc1dc29303d23643d4e37c4042c356c215907
  NXF_ANSI_LOG: 'false'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out FAIR-bioHeaders-Tools v0.8.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FAIR-bioHeaders/FAIR-bioHeaders-Tools
          ref: ${{ env.CONVERTER_COMMIT }}
          path: converter
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Nextflow
        run: |
          curl -fsSL -o nextflow "https://github.com/nextflow-io/nextflow/releases/download/v${NXF_VER}/nextflow-${NXF_VER}-dist"
          echo "${NXF_DIST_SHA256}  nextflow" | sha256sum --check
          chmod +x nextflow
          sudo mv nextflow /usr/local/bin/nextflow
          nextflow -version

      - name: Install the converter environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --no-deps -r environment/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" -m pip check
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Integration tests
        run: python tests/run.py --converter-source converter

      - name: Build container
        run: docker build -t fhr-nextflow:0.1.0 environment

      - name: Docker example
        env:
          NXF_OFFLINE: 'true'
        run: |
          nextflow run main.nf -profile docker \
            --sequence examples/assembly.gfa --sequence_format gfa \
            --converter_source converter --outdir "$RUNNER_TEMP/results"
          test -s "$RUNNER_TEMP/results/example/sequence/example.fhr.gfa"
          test -s "$RUNNER_TEMP/results/converter-tests/converter-tests.xml"

      - name: Docker FASTA example
        env:
          NXF_OFFLINE: 'true'
        run: |
          nextflow run main.nf -profile docker \
            --sequence examples/genome.fasta --sequence_format fasta \
            --outdir "$RUNNER_TEMP/fasta-results"
          test -s "$RUNNER_TEMP/fasta-results/example/sequence/example.fhr.fa"

      - name: Docker GFF3 example
        env:
          NXF_OFFLINE: 'true'
        run: |
          nextflow run main.nf -profile docker \
            --gff3 'tests/fixtures/gff3/*.gff3' --gff3_genome tests/fixtures/gff3/genome.fa \
            --gff3_fail_on_errors false --outdir "$RUNNER_TEMP/gff3-results"
          test -s "$RUNNER_TEMP/gff3-results/bio-008-internal-stop/gff3/bio-008-internal-stop.gff3-validate.json"
          test -s "$RUNNER_TEMP/gff3-results/str-001-duplicate-id/gff3/str-001-duplicate-id.gff3-validate.html"

      - name: Docker protein example
        env:
          NXF_OFFLINE: 'true'
        run: |
          nextflow run main.nf -profile docker \
            --metadata examples/protein-metadata.json \
            --sequence examples/protein.faa --sequence_format faa \
            --outdir "$RUNNER_TEMP/protein-results"
          test -s "$RUNNER_TEMP/protein-results/protein-metadata/sequence/protein-metadata.fhp.faa"
          grep -q '^;~schema: .*/fhp/v0.4.0' "$RUNNER_TEMP/protein-results/protein-metadata/sequence/protein-metadata.fhp.faa"

      - run: git diff --check HEAD

  nf-test:
    # The modules pin bioconda::fair-bioheaders=X.Y.Z and its BioContainers image
    # quay.io/biocontainers/fair-bioheaders:X.Y.Z--<build>; check that the two agree in
    # every module that uses them, then run nf-test, which pulls the images.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that each module's container matches its Bioconda pin
        run: |
          version="$(sed -n 's/.*bioconda::fair-bioheaders=\([0-9.]*\)$/\1/p' modules/nf-core/fairbioheaders/combine/environment.yml)"
          test -n "$version"
          for module in modules/nf-core/fairbioheaders/*/ modules/convert/ modules/strip/ modules/verify_links/; do
            grep -q "^ *- bioconda::fair-bioheaders=$version$" "$module/environment.yml"
            grep -q "quay.io/biocontainers/fair-bioheaders:$version--" "$module/main.nf"
            grep -q "depot.galaxyproject.org/singularity/fair-bioheaders:$version--" "$module/main.nf"
          done
          # The converter tests' conda environment and the hash-locked image follow the same release.
          grep -q "^ *- bioconda::fair-bioheaders=$version$" modules/converter_tests/environment.yml
          grep -q "fair_bioheaders-$version-py3-none-any.whl" environment/requirements.in
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with:
          version: ${{ env.NXF_VER }}
      - uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2.1.0
        with:
          version: 0.9.5
      - name: Run nf-test
        run: nf-test test --profile docker --ci --verbose

  dockstore-workflow:
    # Runs workflows/fairbioheaders (described for Dockstore by .dockstore.yml) with
    # -profile test,docker. The workflow uses the modules' BioContainers images and its
    # conda profile pins the modules' Bioconda package; check both first.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the workflow uses the modules' containers and Bioconda pin
        run: |
          workflow=workflows/fairbioheaders
          # No container override: both processes run the modules' BioContainers image.
          if grep -nE '^\s*container\s*=' "$workflow/nextflow.config"; then exit 1; fi
          version="$(sed -n 's/^ *- bioconda::fair-bioheaders=\([0-9.]*\)$/\1/p' "$workflow/environment.yml")"
          test -n "$version"
          for module in modules/nf-core/fairbioheaders/*/; do
            grep -q "^ *- bioconda::fair-bioheaders=$version$" "$module/environment.yml"
            grep -q "quay.io/biocontainers/fair-bioheaders:$version--" "$module/main.nf"
          done
          # .dockstore.yml points at files that exist.
          for path in $(grep -oE '^ *(primaryDescriptorPath: |readMePath: |- )/[A-Za-z0-9_./-]+$' .dockstore.yml | grep -oE '/[A-Za-z0-9_./-]+$'); do
            test -f ".$path"
          done
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with:
          version: ${{ env.NXF_VER }}
      - name: Run the test profile
        run: |
          nextflow run workflows/fairbioheaders/main.nf -profile test,docker --outdir results
          for id in fasta gfa gff3 jsonld protein; do
            grep -q '^Checksum verified\.$' "results/verify/$id.verify.txt"
          done
          test -s results/combine/protein.fhp.faa
          ls -l results/combine results/verify
